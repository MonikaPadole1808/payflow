spring:
  application:
    name: payflow

  datasource:
    url: jdbc:postgresql://localhost:5432/payflow
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework: INFO

payflow:
  security:
    jwt:
      secret: ${PAYFLOW_JWT_SECRET}
      access-token-expiration-minutes: ${PAYFLOW_JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:15}
      refresh-token-expiration-days: ${PAYFLOW_JWT_REFRESH_TOKEN_EXPIRATION_DAYS:7}
    cors:
      allowed-origins: ${PAYFLOW_CORS_ALLOWED_ORIGINS:http://localhost:3000}
